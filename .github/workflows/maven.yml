# This workflow builds the normal compatibility matrix and validates the final release package.

name: Build

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 8, 11, 17, 21, 25 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Build and test with Maven
        run: mvn -B -s .github/workflows/settings.xml clean package --file pom.xml

  releasePackage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build standalone dependency
        run: mvn -B -s .github/workflows/settings.xml clean install -P Standalone --file pom.xml
      - name: Build release package
        run: mvn -B -s .github/workflows/settings.xml clean package -P Release --file pom.xml
      - name: Validate packaged server metadata
        shell: bash
        run: |
          JAR="$(find Minepacks/target -maxdepth 1 -type f -name '*-Release.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q '^folia-supported: true$'
          if unzip -l "$JAR" | grep -q 'paper-plugin.yml'; then
            echo 'Experimental paper-plugin.yml must not be present in the release JAR.' >&2
            exit 1
          fi
