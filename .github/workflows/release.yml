# Builds Minepacks release variants and attaches the JARs directly to a newly created GitHub release.

name: Build and release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up workspace
        run: mkdir -p artifacts

      - name: Build normal package
        run: |
          mvn -B -s .github/workflows/settings.xml install --file pom.xml
          cp Minepacks/target/M*.jar artifacts/

      - name: Build standalone package
        run: |
          mvn -B -s .github/workflows/settings.xml clean install --file pom.xml -P Standalone,ExcludeBadRabbit
          cp Minepacks/target/M*-Standalone.jar artifacts/

      - name: Build release package
        run: |
          mvn -B -s .github/workflows/settings.xml clean package --file pom.xml -P Release
          cp Minepacks/target/M*-Release.jar artifacts/

      - name: Attach JARs to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/M*.jar --clobber
