# Builds the self-contained Minepacks production JAR and attaches it directly to a GitHub release.

name: Build and release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Build self-contained production package
        run: mvn -B -s .github/workflows/settings.xml clean package --file pom.xml -P Standalone

      - name: Prepare production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          JAR="$(find Minepacks/target -maxdepth 1 -type f -name '*-Standalone.jar' -print -quit)"
          test -n "$JAR"
          NAME="$(basename "$JAR")"
          NAME="${NAME%-Standalone.jar}.jar"
          cp "$JAR" "artifacts/$NAME"
          unzip -p "artifacts/$NAME" plugin.yml | grep -q '^folia-supported: true$'
          unzip -p "artifacts/$NAME" plugin.yml | grep -q '^main: "at.pcgamingfreaks.MinepacksStandalone.Bukkit.Minepacks"$'
          if unzip -l "artifacts/$NAME" | grep -q 'MinepacksBadRabbit.class'; then
            echo 'BadRabbit must not be present in the production JAR.' >&2
            exit 1
          fi
          echo "Production asset: $NAME"

      - name: Attach JAR to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/Minepacks-*.jar --clobber
