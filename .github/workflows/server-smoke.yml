name: Server Smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 3'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-smoke:
    name: Paper / Purpur / Folia 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Minepacks Release JAR
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -s .github/workflows/settings.xml clean install -P Standalone --file pom.xml
          mvn -B -s .github/workflows/settings.xml clean package -P Release --file pom.xml
          JAR="$(find Minepacks/target -maxdepth 1 -type f -name '*-Release.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Minepacks-Release.jar"

      - name: Download Paper, Purpur, and Folia 26.2
        shell: bash
        env:
          MINECRAFT_VERSION: '26.2'
          PAPERMC_USER_AGENT: 'Minepacks-CI/2.5.9.1 (https://github.com/wickidcow/Minepacks)'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/servers"

          download_fill_build() {
            local project="$1"
            local channel_mode="$2"
            local output="$3"
            local response url

            response="$(curl -fsSL --retry 3 --retry-delay 2 \
              -H "User-Agent: $PAPERMC_USER_AGENT" \
              "https://fill.papermc.io/v3/projects/${project}/versions/${MINECRAFT_VERSION}/builds")"

            if [ "$channel_mode" = 'stable' ]; then
              url="$(printf '%s' "$response" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')"
            else
              url="$(printf '%s' "$response" | jq -r 'first(.[] | select(.channel == "STABLE" or .channel == "BETA") | .downloads."server:default".url) // empty')"
            fi

            if [ -z "$url" ]; then
              echo "No suitable ${project} ${MINECRAFT_VERSION} build was returned by PaperMC Fill." >&2
              return 1
            fi

            curl -fL --retry 3 --retry-delay 2 \
              -H "User-Agent: $PAPERMC_USER_AGENT" \
              "$url" -o "$output"
          }

          download_fill_build paper stable "$RUNNER_TEMP/servers/paper.jar"
          curl -fL --retry 3 --retry-delay 2 \
            "https://api.purpurmc.org/v2/purpur/${MINECRAFT_VERSION}/latest/download" \
            -o "$RUNNER_TEMP/servers/purpur.jar"

          # Folia 26.2 may be published on the beta channel. Download it for compatibility
          # coverage, but its startup result is handled as experimental below.
          if ! download_fill_build folia beta "$RUNNER_TEMP/servers/folia.jar"; then
            echo 'Folia 26.2 build unavailable; Folia smoke will be reported as experimental/skipped.'
            rm -f "$RUNNER_TEMP/servers/folia.jar"
          fi

      - name: Boot Paper and verify Minepacks
        shell: bash
        env:
          SERVER_TYPE: paper
          EXPECTED_LOG: 'Paper compatibility enabled using the stable Bukkit plugin loading path.'
        run: |
          set -euo pipefail
          bash .github/workflows/smoke-server.sh \
            "$RUNNER_TEMP/servers/${SERVER_TYPE}.jar" \
            "$RUNNER_TEMP/Minepacks-Release.jar" \
            "$RUNNER_TEMP/smoke-${SERVER_TYPE}" \
            "$EXPECTED_LOG"

      - name: Boot Purpur and verify Minepacks
        shell: bash
        env:
          SERVER_TYPE: purpur
          EXPECTED_LOG: 'Purpur compatibility enabled using the stable Paper/Bukkit API path.'
        run: |
          set -euo pipefail
          bash .github/workflows/smoke-server.sh \
            "$RUNNER_TEMP/servers/${SERVER_TYPE}.jar" \
            "$RUNNER_TEMP/Minepacks-Release.jar" \
            "$RUNNER_TEMP/smoke-${SERVER_TYPE}" \
            "$EXPECTED_LOG"

      - name: Boot Folia and verify Minepacks (experimental 26.2)
        shell: bash
        env:
          SERVER_TYPE: folia
          EXPECTED_LOG: 'Folia compatibility enabled with entity-aware scheduling.'
        run: |
          set -u
          if [ ! -f "$RUNNER_TEMP/servers/${SERVER_TYPE}.jar" ]; then
            echo '::warning::Folia 26.2 build was unavailable from PaperMC Fill; experimental smoke skipped.'
            exit 0
          fi

          if ! bash .github/workflows/smoke-server.sh \
            "$RUNNER_TEMP/servers/${SERVER_TYPE}.jar" \
            "$RUNNER_TEMP/Minepacks-Release.jar" \
            "$RUNNER_TEMP/smoke-${SERVER_TYPE}" \
            "$EXPECTED_LOG"; then
            echo '::warning::Folia 26.2 is an experimental/beta runtime; startup smoke failed. Review the Folia log before release.'
            exit 0
          fi

      - name: Publish smoke failure diagnostic
        if: ${{ failure() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- minepacks-server-smoke -->'
          REPORT="$RUNNER_TEMP/server-smoke-diagnostic.md"
          {
            echo "$MARKER"
            echo '### Server Smoke diagnostic'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            for platform in paper purpur folia; do
              log="$RUNNER_TEMP/smoke-${platform}/server.log"
              if [ -f "$log" ]; then
                echo "#### ${platform^}"
                echo '```text'
                grep -E -i 'Minepacks|ERROR|WARN|Exception|Caused by|Could not load|failed|unsupported|Done \(' "$log" | tail -n 120 || tail -n 120 "$log" || true
                echo '```'
                echo
              fi
            done
          } > "$REPORT"

          REPO="$GITHUB_REPOSITORY"
          COMMENT_ID="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- minepacks-server-smoke -->")) | .id' | head -n 1)"
          jq -Rs '{body: .}' < "$REPORT" > "$RUNNER_TEMP/comment.json"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" --input "$RUNNER_TEMP/comment.json" >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input "$RUNNER_TEMP/comment.json" >/dev/null
          fi
